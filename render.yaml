services:
  - type: web
    name: bluecollar
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npx prisma generate
    startCommand: cd server && npx prisma migrate deploy && node prisma/seed.js && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: bluecollar_secret_jwt_key_2026_xyz_production
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: "*"
      - key: DATABASE_URL
        sync: false
